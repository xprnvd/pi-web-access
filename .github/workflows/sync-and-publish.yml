name: Sync and publish

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  sync:
    # Merge upstream's default branch into the fork.
    # Skipped for a tag push: the tag is already the release point.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/nicobailon/pi-web-access.git"
          # --no-tags keeps upstream's tag names out of the fork's tag
          # namespace, so the fork's own release tags stay unambiguous.
          git fetch --no-tags upstream "main:refs/remotes/upstream/main"
      - name: Merge upstream
        run: git merge --no-edit "refs/remotes/upstream/main"
      - name: Push the merge
        run: git push origin "HEAD:main"
      - name: Read the package version
        id: version
        working-directory: .
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The merge was pushed with GITHUB_TOKEN, which does not trigger other
      # workflows, so code scanning runs here on the merged tree.
      - uses: github/codeql-action/init@v4
        with:
          language: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  publish:
    needs: sync
    if: >-
      always() &&
      (github.event_name == 'push' || needs.sync.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Check the tag matches the package version
        if: github.event_name == 'push'
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
      - run: npm test
      - name: Check whether the version is already on npm
        id: check
        working-directory: .
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          version="$(node -p "require('./package.json').version")"
          if npm view "${scope}/pi-web-access@${version}" version >/dev/null 2>&1; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Set the published package identity
        if: steps.check.outputs.published == 'true'
        working-directory: .
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          npm pkg set name="${scope}/pi-web-access"
          npm pkg set repository.type=git
          npm pkg set repository.url="git+https://github.com/xprnvd/pi-web-access.git"
          npm pkg delete repository.directory || true
      - name: Build the publishable package
        if: steps.check.outputs.published == 'true'
        working-directory: .
        run: true
      # Trusted publishing generates the provenance attestation on its own;
      # --provenance keeps it explicit, so a broken attestation fails the
      # publish instead of shipping a package without one.
      - name: Publish to npm
        if: steps.check.outputs.published == 'true'
        working-directory: .
        run: npm publish . --provenance --access public
