name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # Publish to npm when a version tag is pushed.
    #
    # Authentication is npm's trusted publishing: the npm CLI exchanges this
    # workflow's OIDC identity for a short-lived publish token. There is no
    # npm token in this repository, and nothing long-lived to leak or rotate.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'xprnvd/pi-web-access'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for the OIDC exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag $tag does not match package version $version" >&2
            exit 1
          fi
      - run: npm test
      - name: Set the published package identity
        env:
          PD_SCOPE: ${{ vars.PD_SCOPE }}
        run: |
          scope="${PD_SCOPE:-@xprnvd}"
          npm pkg set name="${scope}/pi-web-access"
          npm pkg set repository.type=git
          npm pkg set repository.url="git+https://github.com/xprnvd/pi-web-access.git"
          npm pkg delete repository.directory || true
      # Trusted publishing generates the provenance attestation on its own;
      # --provenance keeps it explicit, so a broken attestation fails the
      # publish instead of shipping a package without one.
      - run: npm publish --provenance --access public
