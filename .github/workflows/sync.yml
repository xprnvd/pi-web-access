name: Sync upstream

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    # Merge upstream's default branch into the fork, scan the result, and hand
    # the publish job in ci.yml the merged tree.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set the commit identity
        run: |
          git config user.name "xprnvd"
          git config user.email "xprnvd@users.noreply.github.com"
      - name: Fetch the upstream releases
        run: |
          git remote add upstream "https://github.com/nicobailon/pi-web-access.git"
          git fetch --tags upstream
      - name: Find the latest upstream release
        id: tag
        run: |
          tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          if [ -z "$tag" ]; then
            echo "no upstream release tag found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          current=""
          if [ -f pd/upstream-tag ]; then
            current="$(cat pd/upstream-tag)"
          fi
          if [ "$tag" = "$current" ]; then
            echo "upstream=up-to-date" >> "$GITHUB_OUTPUT"
            echo "upstream release $tag is already in this repository" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "upstream=behind" >> "$GITHUB_OUTPUT"
            echo "new upstream release: $tag (was $current)" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The release tag, not upstream's branch. Upstream bumps the version in a
      # release commit and then keeps committing, so the branch carries a
      # released version number with unreleased work behind it. Publishing that
      # would put a tarball on npm whose contents differ from upstream's own
      # release of the same version number.
      - name: Merge the upstream release
        if: steps.tag.outputs.upstream == 'behind'
        run: |
          git merge --no-edit "${{ steps.tag.outputs.tag }}"
          echo "${{ steps.tag.outputs.tag }}" > pd/upstream-tag
      - name: Commit and push
        if: steps.tag.outputs.upstream == 'behind'
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "already at ${{ steps.tag.outputs.tag }}"
            exit 0
          fi
          git commit -m "Sync from upstream release ${{ steps.tag.outputs.tag }}"
          git push origin "HEAD:main"
      # The merge was pushed with GITHUB_TOKEN, which does not trigger other
      # workflows, so code scanning runs here on the merged tree.
      - uses: github/codeql-action/init@v4
        if: steps.tag.outputs.upstream == 'behind'
        with:
          language: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        if: steps.tag.outputs.upstream == 'behind'
      - name: Hand the merged tree to the publish job
        if: steps.tag.outputs.upstream == 'behind'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=publish-extension
